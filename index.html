<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maze Escaper</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <section id="screen-home">
      <h1>Maze Escaper</h1>
      <p>Trova l'uscita prima che finisca l'aria.</p>
      <button id="btn-play" class="primary">Gioca</button>
    </section>

    <section id="screen-run" hidden>
      <header>
        <span id="hud-level">1</span>
        <span id="hud-air">0</span>
        <span id="hud-coins">0</span>
      </header>
      <canvas id="maze-canvas" width="640" height="640"></canvas>
    </section>

    <section id="screen-result" hidden>
      <h1 id="result-title">Run conclusa</h1>
      <div id="loot-panel">
        <div><span>Casse aperte</span><span id="loot-chests">0</span></div>
        <div><span>Tesori trovati</span><span id="loot-treasures">0</span></div>
        <div><span>Monete recuperate</span><span id="loot-coins">0</span></div>
      </div>
      <button id="btn-retry">Riprova</button>
      <button id="btn-menu">Menu</button>
    </section>
  </main>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
